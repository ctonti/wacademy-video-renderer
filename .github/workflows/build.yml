name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
            build_cmd: npm run build:mac -- --arm64
            artifact_name: mac-silicon
            asset_path: dist-electron/*.dmg
          - os: macos-14
            arch: x64
            build_cmd: npm install --arch=x64 --force ffmpeg-static ffprobe-static && npm run build:mac -- --x64
            artifact_name: mac-intel
            asset_path: dist-electron/*.dmg
          - os: windows-latest
            arch: x64
            build_cmd: npm run build:win -- --x64
            artifact_name: windows
            asset_path: dist-electron/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build App
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoRenderer-${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate release tag
        id: tag
        run: echo "tag=v1.0.$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: VideoRenderer ${{ steps.tag.outputs.tag }}
          body: |
            ## Download VideoRenderer

            | Piattaforma | File |
            |---|---|
            | 🍎 Mac Apple Silicon (M1/M2/M3/M4) | `.dmg` dal pacchetto **mac-silicon** |
            | 🍏 Mac Intel | `.dmg` dal pacchetto **mac-intel** |
            | 🪟 Windows | `.exe` dal pacchetto **windows** |
          files: release-assets/**/*
          draft: false
          prerelease: false
